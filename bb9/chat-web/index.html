<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BB9 Web Chat</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="bb9-chat" class="app">
    <header>
      <h1>BB9</h1>
      <div class="top-actions">
        <select id="project" title="Projet actif"></select>
        <select id="session" title="Sessions"></select>
        <button id="new-session" class="icon-button" type="button" title="Nouvelle session" aria-label="Nouvelle session">+</button>
        <select id="theme" title="Thème">
          <option value="system">Système</option>
          <option value="light">Clair</option>
          <option value="dark">Sombre</option>
        </select>
      </div>
      <div id="status" class="status">Prêt</div>
    </header>
    <main>
      <div id="banner" class="banner"></div>
      <div id="thread" class="thread"></div>
    </main>
    <form id="form">
      <div id="draft-queue" class="draft-queue"></div>
      <div id="queued" class="queued"></div>
      <div class="composer">
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple>
        <textarea id="message" name="message" autocomplete="off" placeholder="Message BB9"></textarea>
        <div class="composer-bar">
          <button id="attach" class="attach" type="button" title="Joindre une image">+</button>
          <button id="send" class="send-icon" type="submit" title="Envoyer" aria-label="Envoyer">↑</button>
        </div>
      </div>
      <div id="command-menu" class="command-menu" hidden></div>
      <div class="composer-actions">
        <select id="profile" title="Niveau de sécurité"></select>
        <input id="model" type="text" autocomplete="off" placeholder="Modèle">
        <select id="reasoning" title="Niveau de raisonnement"></select>
        <button id="apply-settings" type="button">Appliquer</button>
      </div>
    </form>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
