<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BB9 Web Chat</title>
  <link rel="stylesheet" href="./app.css?v=workspace-switch-1">
</head>
<body>
  <div id="bb9-chat" class="app">
    <nav id="sidebar" class="sidebar" aria-label="Navigation">
      <ul class="sidebar-nav">
        <li>
          <button class="sidebar-link" type="button" data-panel="providers">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M9 3v4M15 3v4"/>
              <rect x="5" y="7" width="14" height="6" rx="2"/>
              <path d="M12 13v4"/>
              <circle cx="12" cy="19" r="2"/>
            </svg>
            <span>Providers</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" data-panel="agents">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="7" r="4"/>
              <path d="M4 20c0-3.9 3.6-7 8-7s8 3.1 8 7"/>
            </svg>
            <span>Agents</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" data-panel="skills">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <path d="M14 2v6h6"/>
              <path d="M8 13h8M8 17h5"/>
            </svg>
            <span>Skills</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" data-panel="projects">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
            <span>Projets</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" data-panel="notes">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M5 3h11l3 3v15a0 0 0 0 1 0 0H5a0 0 0 0 1 0 0z"/>
              <path d="M9 8h6M9 12h6M9 16h4"/>
            </svg>
            <span>Notes &amp; todos</span>
          </button>
        </li>
        <li>
          <button class="sidebar-link" type="button" data-panel="routines">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M17 2l4 4-4 4"/>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              <path d="M7 22l-4-4 4-4"/>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
            <span>Routines</span>
          </button>
        </li>
      </ul>
    </nav>
    <header>
      <div class="brand">
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" title="Menu" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sidebar">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M9 3v18"/>
          </svg>
        </button>
        <h1>BB9</h1>
      </div>
      <button id="header-project" class="header-project" type="button" title="Projet actif — gérer les projets" aria-label="Projet actif" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
        <span id="header-project-name" class="header-project-name"></span>
      </button>
      <div class="top-actions">
        <label class="icon-select" title="Channel actif" aria-label="Channel actif">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 6.5A3.5 3.5 0 0 1 7.5 3h9A3.5 3.5 0 0 1 20 6.5v6A3.5 3.5 0 0 1 16.5 16H10l-5 4v-4.5A3.5 3.5 0 0 1 4 12.9V6.5Z"></path>
            <path d="M8 8h8"></path>
            <path d="M8 12h5"></path>
          </svg>
          <span id="channel-badge" class="channel-badge" hidden>0</span>
          <select id="project"></select>
        </label>
        <div class="git-status">
          <button id="git-diff" class="git-button" type="button" title="Git" aria-label="Git">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="6" cy="18" r="2.5"></circle>
              <circle cx="6" cy="6" r="2.5"></circle>
              <circle cx="18" cy="6" r="2.5"></circle>
              <path d="M6 8.5v7"></path>
              <path d="M8.5 6h4.5a5 5 0 0 1 5 5v0"></path>
            </svg>
            <span id="git-count" class="git-count" hidden>0</span>
          </button>
        </div>
        <label class="icon-select" title="Historique" aria-label="Historique">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 1 0 3-6.7"></path>
            <path d="M3 4v5h5"></path>
          </svg>
          <select id="session"></select>
        </label>
        <label class="icon-select" title="Thème" aria-label="Thème">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 3a9 9 0 0 0 0 18 9 9 0 0 0 0-18Z"></path>
            <path d="M12 3v18"></path>
          </svg>
          <select id="theme">
            <option value="system">Système</option>
            <option value="light">Clair</option>
            <option value="dark">Sombre</option>
          </select>
        </label>
        <button id="new-session" class="icon-button bare" type="button" title="Nouvelle session" aria-label="Nouvelle session">+</button>
      </div>
      <div id="status" class="status" hidden></div>
    </header>
    <aside id="git-panel" class="git-panel" hidden>
      <div class="git-panel-head">
        <div>
          <div class="git-panel-kicker">Git</div>
          <div id="git-panel-title" class="git-panel-title">Projet</div>
        </div>
        <div class="git-panel-actions">
          <button id="git-commit" class="git-panel-action git-commit-button" type="button" title="Préparer un commit" aria-label="Préparer un commit">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M5 3h12l2 2v16H5z"></path>
              <path d="M8 3v6h8V3"></path>
              <path d="M8 21v-7h8v7"></path>
            </svg>
          </button>
          <button id="git-panel-fullscreen" class="git-panel-action" type="button" title="Plein écran" aria-label="Plein écran" aria-pressed="false">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8 3H3v5"></path>
              <path d="M16 3h5v5"></path>
              <path d="M21 16v5h-5"></path>
              <path d="M3 16v5h5"></path>
            </svg>
          </button>
          <button id="git-panel-close" class="git-panel-action git-panel-close" type="button" title="Fermer" aria-label="Fermer">×</button>
        </div>
      </div>
      <label class="git-branch-field">
        <span>Branche</span>
        <select id="git-branch" class="branch-select" title="Branche Git" aria-label="Branche Git"></select>
        <span id="git-branch-note" class="git-branch-note"></span>
      </label>
      <div class="git-commit">
        <div id="git-commit-note" class="git-commit-note"></div>
        <div id="git-commit-preview" class="git-commit-preview" hidden>
          <label for="git-commit-message">Message généré</label>
          <textarea id="git-commit-message" rows="4" spellcheck="true"></textarea>
          <div class="git-commit-actions">
            <button id="git-commit-confirm" class="git-commit-confirm" type="button">Confirmer</button>
            <button id="git-commit-cancel" class="git-commit-cancel" type="button">Annuler</button>
          </div>
        </div>
      </div>
      <div id="git-files" class="git-files"></div>
    </aside>
    <main>
      <div id="banner" class="banner"></div>
      <div id="thread" class="thread"></div>
    </main>
    <form id="form">
      <div id="draft-queue" class="draft-queue"></div>
      <section id="plan-panel" class="plan-panel" hidden></section>
      <div id="queued" class="queued"></div>
      <div id="command-menu" class="command-menu" hidden></div>
      <div class="composer">
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple>
        <textarea id="message" name="message" autocomplete="off" placeholder="Message BB9" rows="1"></textarea>
        <div id="context-bar" class="context-bar" title="Fenêtre de contexte" hidden>
          <div id="context-bar-fill" class="context-bar-fill"></div>
        </div>
        <div class="composer-bar">
          <button id="attach" class="attach" type="button" title="Joindre une image">+</button>
          <div class="composer-settings">
            <select id="profile" title="Niveau de sécurité"></select>
            <select id="model" title="Modèle"></select>
            <span id="model-effective" class="model-effective" hidden></span>
            <select id="reasoning" title="Niveau de raisonnement"></select>
          </div>
          <div class="composer-run-actions">
            <button id="stop" class="stop-run" type="button" title="Arrêter" aria-label="Arrêter" hidden>■</button>
            <button id="send" class="send-icon" type="submit" title="Envoyer" aria-label="Envoyer">↑</button>
          </div>
        </div>
      </div>
    </form>
    <div id="providers-modal" class="providers-modal" hidden role="dialog" aria-modal="true" aria-labelledby="providers-modal-title">
      <div class="providers-modal-box">
        <div class="providers-modal-head">
          <h2 id="providers-modal-title" class="providers-modal-title">Providers</h2>
          <button type="button" id="providers-modal-close" class="providers-modal-close" aria-label="Fermer">×</button>
        </div>
        <div id="providers-list" class="providers-list"></div>
        <div class="providers-add-bar">
          <button type="button" id="providers-add-btn" class="providers-add-btn">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            Ajouter un provider
          </button>
        </div>
        <form id="providers-form" class="providers-form" hidden>
          <input type="hidden" id="pf-id">
          <div class="providers-field">
            <label class="providers-label" for="pf-name">Nom</label>
            <input type="text" id="pf-name" class="providers-input" placeholder="Mon provider" autocomplete="off">
          </div>
          <div class="providers-field">
            <span class="providers-label">Type de connexion</span>
            <div class="providers-auth-tabs">
              <button type="button" class="providers-auth-tab active" data-auth="api">Clé API</button>
              <button type="button" class="providers-auth-tab" data-auth="web">Auth Web</button>
            </div>
          </div>
          <div id="providers-api-section" class="providers-form-section">
            <div class="providers-field">
              <label class="providers-label" for="pf-provider">Provider</label>
              <select id="pf-provider" class="providers-select">
                <option value="openai">OpenAI</option>
                <option value="deepseek">DeepSeek</option>
                <option value="openrouter">OpenRouter</option>
                <option value="openai-compatible">Compatible OpenAI</option>
                <option value="ollama">Ollama local</option>
                <option value="ollama-cloud">Ollama Cloud</option>
              </select>
            </div>
            <div class="providers-field">
              <label class="providers-label" for="pf-url">URL de base</label>
              <input type="url" id="pf-url" class="providers-input" placeholder="https://api.openai.com/v1">
            </div>
            <div class="providers-field">
              <label class="providers-label" for="pf-key">Clé API</label>
              <input type="password" id="pf-key" class="providers-input" placeholder="sk-...">
            </div>
          </div>
          <div id="providers-web-section" class="providers-form-section" hidden>
            <div class="providers-field">
              <label class="providers-label" for="pf-web-provider">Provider</label>
              <select id="pf-web-provider" class="providers-select">
                <option value="openai">OpenAI / ChatGPT</option>
                <option value="anthropic">Anthropic</option>
              </select>
            </div>
          </div>
          <div class="providers-form-actions">
            <button type="button" id="pf-cancel" class="providers-cancel">Annuler</button>
            <button type="submit" id="pf-submit" class="providers-submit">Ajouter</button>
          </div>
        </form>
      </div>
    </div>
    <div id="skills-modal" class="providers-modal skills-modal" hidden role="dialog" aria-modal="true" aria-labelledby="skills-modal-title">
      <div class="providers-modal-box skills-modal-box">
        <div class="providers-modal-head">
          <h2 id="skills-modal-title" class="providers-modal-title">Skills</h2>
          <button type="button" id="skills-modal-close" class="providers-modal-close" aria-label="Fermer">×</button>
        </div>
        <div class="skills-modal-body">
          <div class="skills-list-pane agents-list-pane">
            <button type="button" id="skills-add" class="providers-add-btn agents-add-btn">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              Ajouter un skill
            </button>
            <div id="skills-list" class="skills-list"></div>
          </div>
          <section class="skills-editor" aria-label="Éditeur de skill">
            <div id="skills-empty" class="skills-empty">Sélectionne un skill.</div>
            <form id="skills-form" class="skills-form" hidden>
              <div class="skills-editor-head">
                <div>
                  <div id="skills-editor-title" class="skills-editor-title"></div>
                  <div id="skills-editor-meta" class="skills-editor-meta"></div>
                </div>
                <button type="submit" id="skills-save" class="providers-submit">Enregistrer</button>
              </div>
              <div id="skills-name-field" class="skill-create-fields" hidden>
                <div class="providers-field">
                  <label class="providers-label" for="skill-name">Nom du skill</label>
                  <input type="text" id="skill-name" class="providers-input" placeholder="mon-skill" autocomplete="off">
                </div>
                <div class="providers-field">
                  <label class="providers-label" for="skill-source">Portée</label>
                  <select id="skill-source" class="providers-select">
                    <option value="global">global utilisateur</option>
                    <option value="local">local projet</option>
                  </select>
                </div>
              </div>
              <textarea id="skill-body" class="skill-body" spellcheck="false"></textarea>
            </form>
          </section>
        </div>
      </div>
    </div>
    <div id="agents-modal" class="providers-modal skills-modal" hidden role="dialog" aria-modal="true" aria-labelledby="agents-modal-title">
      <div class="providers-modal-box skills-modal-box">
        <div class="providers-modal-head">
          <h2 id="agents-modal-title" class="providers-modal-title">Agents</h2>
          <button type="button" id="agents-modal-close" class="providers-modal-close" aria-label="Fermer">×</button>
        </div>
        <div class="skills-modal-body">
          <div class="agents-list-pane">
            <button type="button" id="agents-add" class="providers-add-btn agents-add-btn">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              Ajouter un agent
            </button>
            <div id="agents-list" class="skills-list agents-list"></div>
          </div>
          <section class="skills-editor" aria-label="Éditeur d'agent">
            <div id="agents-empty" class="skills-empty">Sélectionne un agent.</div>
            <form id="agents-form" class="skills-form" hidden>
              <div class="skills-editor-head">
                <div>
                  <div class="agent-title-row">
                    <div id="agents-editor-title" class="skills-editor-title"></div>
                    <button class="agent-action agent-title-edit" type="button" id="agents-title-edit" title="Renommer" aria-label="Renommer l'agent">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                  </div>
                  <div id="agents-title-field" class="agent-title-field" hidden>
                    <input type="text" id="agents-title-input" class="providers-input agent-title-input" autocomplete="off" aria-label="Nom de l'agent">
                  </div>
                  <div id="agents-editor-meta" class="skills-editor-meta"></div>
                </div>
                <div class="agent-head-actions">
                  <label class="agent-subagent-switch" for="agent-subagent">
                    <span>Subagent</span>
                    <button class="skill-toggle" type="button" id="agent-subagent" role="switch" aria-checked="false"></button>
                  </label>
                  <button type="submit" id="agents-save" class="providers-submit">Enregistrer</button>
                </div>
              </div>
              <div id="agents-name-field" class="providers-field" hidden>
                <label class="providers-label" for="agent-name">Nom de l'agent</label>
                <input type="text" id="agent-name" class="providers-input" placeholder="mon-agent" autocomplete="off">
              </div>
              <div class="agent-tabs" id="agent-tabs" role="tablist">
                <button type="button" class="agent-tab active" id="agent-tab-btn-settings" data-tab="settings" role="tab" aria-selected="true">Paramètres</button>
                <button type="button" class="agent-tab" id="agent-tab-btn-skills" data-tab="skills" role="tab" aria-selected="false">Skills</button>
                <button type="button" class="agent-tab" id="agent-tab-btn-tools" data-tab="tools" role="tab" aria-selected="false">Tools</button>
              </div>
              <div class="agent-tab-panel" id="agent-tab-settings" role="tabpanel">
              <div class="agent-model-row">
                <div class="providers-field">
                  <label class="providers-label" for="agent-model">Modèle (MODEL.md)</label>
                  <select id="agent-model" class="providers-select">
                    <option value="">hérité du provider actif</option>
                  </select>
                </div>
                <div class="providers-field">
                  <label class="providers-label" for="agent-reasoning">Raisonnement</label>
                  <select id="agent-reasoning" class="providers-select">
                    <option value="">hérité</option>
                    <option value="none">none</option>
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                    <option value="xhigh">xhigh</option>
                  </select>
                </div>
              </div>
              <section class="agent-channel-panel">
                <div class="agent-channel-head">
                  <label class="agent-subagent-switch" for="agent-telegram-enabled">
                    <span>Telegram</span>
                    <button class="skill-toggle" type="button" id="agent-telegram-enabled" role="switch" aria-checked="false"></button>
                  </label>
                </div>
                <div id="agent-telegram-fields" class="agent-telegram-fields" hidden>
                  <div class="providers-field">
                    <label class="providers-label" for="agent-telegram-token">Token</label>
                    <input type="password" id="agent-telegram-token" class="providers-input" autocomplete="off" spellcheck="false">
                  </div>
                  <div class="providers-field">
                    <label class="providers-label" for="agent-telegram-chat-id-input">Chat IDs autorisés</label>
                    <div class="array-chip-editor">
                      <input type="text" id="agent-telegram-chat-id-input" class="providers-input" autocomplete="off" spellcheck="false" placeholder="123456789">
                      <div id="agent-telegram-chat-id-chips" class="array-chip-list" aria-live="polite"></div>
                      <input type="hidden" id="agent-telegram-chat-ids" value="[]">
                    </div>
                  </div>
                </div>
              </section>
              <div class="agent-editors">
                <div class="agent-editor-field">
                  <label class="providers-label" for="agent-identity">IDENTITY.md</label>
                  <textarea id="agent-identity" class="skill-body agent-identity" spellcheck="false"></textarea>
                </div>
                <div class="agent-editor-field">
                  <label class="providers-label" for="agent-soul">SOUL.md</label>
                  <textarea id="agent-soul" class="skill-body agent-soul" spellcheck="false"></textarea>
                </div>
              </div>
              </div>
              <div class="agent-tab-panel agent-archives" id="agent-tab-skills" role="tabpanel" hidden>
                <section class="agent-archive-group">
                  <h3 class="agent-archive-title">Skills actifs</h3>
                  <div id="agent-skills" class="agent-archive-list"></div>
                </section>
                <section class="agent-archive-group" id="agent-subagents-group">
                  <h3 class="agent-archive-title">Subagents spawnables</h3>
                  <div id="agent-subagents" class="agent-archive-list"></div>
                </section>
              </div>
              <div class="agent-tab-panel agent-archives" id="agent-tab-tools" role="tabpanel" hidden>
                <section class="agent-archive-group">
                  <h3 class="agent-archive-title">Tools actifs</h3>
                  <div id="agent-tools" class="agent-archive-list"></div>
                </section>
              </div>
            </form>
          </section>
        </div>
      </div>
    </div>
    <div id="projects-modal" class="providers-modal" hidden role="dialog" aria-modal="true" aria-labelledby="projects-modal-title">
      <div class="providers-modal-box projects-modal-box">
        <div class="providers-modal-head">
          <h2 id="projects-modal-title" class="providers-modal-title">Projets</h2>
          <button type="button" id="projects-modal-close" class="providers-modal-close" aria-label="Fermer">×</button>
        </div>
        <div class="projects-modal-body">
          <form id="projects-add-form" class="projects-add-form">
            <input type="text" id="projects-add-path" class="providers-input" placeholder="/chemin/vers/le/projet" autocomplete="off" spellcheck="false" aria-label="Chemin du projet à ajouter">
            <button type="submit" class="providers-submit">Ajouter</button>
          </form>
          <div id="projects-error" class="projects-error" hidden></div>
          <div id="projects-list" class="projects-list"></div>
        </div>
      </div>
    </div>
    <div id="notes-modal" class="providers-modal" hidden role="dialog" aria-modal="true" aria-labelledby="notes-modal-title">
      <div class="providers-modal-box notes-modal-box">
        <div class="providers-modal-head">
          <h2 id="notes-modal-title" class="providers-modal-title">Notes &amp; todos</h2>
          <button type="button" id="notes-modal-close" class="providers-modal-close" aria-label="Fermer">×</button>
        </div>
        <div class="notes-modal-body">
          <div id="notes-error" class="projects-error" hidden></div>
          <section class="notes-section">
            <h3 class="notes-section-title">Todo</h3>
            <form id="todo-add-form" class="projects-add-form">
              <input type="text" id="todo-add-input" class="providers-input" placeholder="Nouvelle tâche" autocomplete="off" aria-label="Nouvelle tâche">
              <button type="submit" class="providers-submit">Ajouter</button>
            </form>
            <div id="todo-list" class="todo-list"></div>
          </section>
          <section class="notes-section">
            <div class="notes-section-head">
              <h3 class="notes-section-title">Notes</h3>
              <button type="button" id="note-add" class="providers-add-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                Nouvelle note
              </button>
            </div>
            <div id="notes-list" class="notes-list"></div>
          </section>
        </div>
      </div>
    </div>
    <div id="routines-modal" class="providers-modal skills-modal" hidden role="dialog" aria-modal="true" aria-labelledby="routines-modal-title">
      <div class="providers-modal-box skills-modal-box">
        <div class="providers-modal-head">
          <h2 id="routines-modal-title" class="providers-modal-title">Routines</h2>
          <button type="button" id="routines-modal-close" class="providers-modal-close" aria-label="Fermer">×</button>
        </div>
        <div class="skills-modal-body">
          <div class="skills-list-pane agents-list-pane">
            <button type="button" id="routines-add" class="providers-add-btn agents-add-btn">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              Ajouter une routine
            </button>
            <div id="routines-list" class="skills-list routines-list"></div>
          </div>
          <section class="skills-editor" aria-label="Éditeur de routine">
            <div id="routines-empty" class="skills-empty">Sélectionne une routine.</div>
            <form id="routines-form" class="skills-form" hidden>
              <div class="skills-editor-head">
                <div>
                  <div id="routines-editor-title" class="skills-editor-title"></div>
                  <div id="routines-editor-meta" class="skills-editor-meta"></div>
                </div>
                <button type="submit" id="routines-save" class="providers-submit">Enregistrer</button>
              </div>
              <div id="routines-name-field" class="skill-create-fields" hidden>
                <div class="providers-field">
                  <label class="providers-label" for="routine-name">Nom de la routine</label>
                  <input type="text" id="routine-name" class="providers-input" placeholder="briefing-matin" autocomplete="off">
                </div>
              </div>
              <div class="routine-fields">
                <div class="providers-field">
                  <label class="providers-label" for="routine-prompt">Prompt</label>
                  <textarea id="routine-prompt" class="providers-input routine-prompt" spellcheck="true" placeholder="Ce que BB9 devra faire quand la routine se déclenche."></textarea>
                </div>
                <div class="routine-grid">
                  <div class="providers-field routine-activation-field">
                    <label class="providers-label" for="routine-activation">Activation</label>
                    <div class="routine-activation-control">
                      <button id="routine-activation" class="skill-toggle" type="button" role="switch" aria-checked="false" aria-label="Activer la routine"></button>
                      <span id="routine-activation-label" class="routine-activation-label">pause</span>
                    </div>
                  </div>
                  <div class="providers-field">
                    <label class="providers-label" for="routine-agent">Agent</label>
                    <select id="routine-agent" class="providers-select">
                      <option value="default">default</option>
                    </select>
                  </div>
                  <div class="providers-field">
                    <label class="providers-label" for="routine-recurrence">Récurrence</label>
                    <select id="routine-recurrence" class="providers-select">
                      <option value="minutely">minutes</option>
                      <option value="hourly">heures</option>
                      <option value="daily">jours</option>
                      <option value="weekly">semaines</option>
                      <option value="monthly">mois</option>
                      <option value="yearly">an</option>
                    </select>
                  </div>
                  <div class="providers-field routine-interval-field" hidden>
                    <label class="providers-label" for="routine-interval">Toutes les</label>
                    <input type="number" id="routine-interval" class="providers-input" min="1" value="1">
                  </div>
                  <div class="providers-field routine-time-field">
                    <label class="providers-label" for="routine-time">Heure</label>
                    <input type="time" id="routine-time" class="providers-input" value="08:30">
                  </div>
                  <div class="providers-field routine-month-field" hidden>
                    <label class="providers-label" for="routine-month">Mois</label>
                    <select id="routine-month" class="providers-select">
                      <option value="1">janvier</option>
                      <option value="2">février</option>
                      <option value="3">mars</option>
                      <option value="4">avril</option>
                      <option value="5">mai</option>
                      <option value="6">juin</option>
                      <option value="7">juillet</option>
                      <option value="8">août</option>
                      <option value="9">septembre</option>
                      <option value="10">octobre</option>
                      <option value="11">novembre</option>
                      <option value="12">décembre</option>
                    </select>
                  </div>
                  <div class="providers-field routine-day-field" hidden>
                    <label class="providers-label" for="routine-day">Jour du mois</label>
                    <input type="number" id="routine-day" class="providers-input" min="1" max="31" value="1">
                  </div>
                  <div class="providers-field">
                    <label class="providers-label" for="routine-timezone">Fuseau</label>
                    <select id="routine-timezone" class="providers-select">
                      <option value="Europe/Paris">Europe/Paris</option>
                    </select>
                  </div>
                </div>
                <div id="routine-weekdays" class="routine-weekdays" hidden>
                  <label><input type="checkbox" value="monday"> Lun</label>
                  <label><input type="checkbox" value="tuesday"> Mar</label>
                  <label><input type="checkbox" value="wednesday"> Mer</label>
                  <label><input type="checkbox" value="thursday"> Jeu</label>
                  <label><input type="checkbox" value="friday"> Ven</label>
                  <label><input type="checkbox" value="saturday"> Sam</label>
                  <label><input type="checkbox" value="sunday"> Dim</label>
                </div>
                <details class="routine-raw">
                  <summary>CRON.md généré</summary>
                  <textarea id="routine-body" class="skill-body routine-body" spellcheck="false"></textarea>
                </details>
              </div>
            </form>
          </section>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./app.js?v=workspace-switch-1"></script>
</body>
</html>
