[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bb9-agentic-system-minimal"
version = "0.1.0"
description = "BB9 minimal agentic runtime"
readme = "bb9/README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bb9 = "bb9.__main__:main"

[tool.setuptools]
packages = ["bb9", "bb9.core"]
include-package-data = false

[tool.setuptools.package-data]
bb9 = ["README.md", "tools/**/*", "templates/**/*"]

[tool.setuptools.exclude-package-data]
bb9 = ["**/__pycache__/*", "**/*.py[cod]", "**/.DS_Store"]
