[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bb9-agentic-system-minimal"
version = "0.1.0"
description = "BB9 minimal agentic runtime"
readme = "bb9/README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bb9 = "bb9.__main__:main"

[tool.setuptools]
packages = ["bb9", "bb9.api", "bb9.core"]
include-package-data = false

[tool.setuptools.package-data]
bb9 = ["README.md", "chat-web/**/*", "tools/**/*", "templates/**/*"]

[tool.setuptools.exclude-package-data]
bb9 = ["**/__pycache__/*", "**/*.py[cod]", "**/.DS_Store"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bb9"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_no_return = false
